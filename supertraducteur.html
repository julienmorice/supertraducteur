<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperTraducteur — IMT Business School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bleu-imt:     #00B8DE;
  --violet-imt:   #AD1D89;
  --noir:         #000000;
  --blanc:        #FFFFFF;
  --gris-clair:   #F4F6F8;
  --gris-texte:   #5A6270;
  --border:       rgba(0,0,0,0.09);
  --bleu-light:   rgba(0,184,222,0.08);
  --bleu-mid:     rgba(0,184,222,0.15);
  --violet-light: rgba(173,29,137,0.08);
  --shadow-sm:    0 2px 8px rgba(0,0,0,0.06);
  --shadow-md:    0 4px 24px rgba(0,0,0,0.10);
  --radius:       14px;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--gris-clair);
  color: var(--noir);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
header {
  background: var(--blanc);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.header-inner {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 2rem;
  height: 64px;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.logo-text {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--gris-texte);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1.2;
}
.logo-sep { width: 1px; height: 28px; background: var(--border); }
.app-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--bleu-imt), var(--violet-imt));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── MAIN ── */
main {
  flex: 1;
  max-width: 960px;
  width: 100%;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* ── API KEY CARD ── */
.api-card {
  background: var(--blanc);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  box-shadow: var(--shadow-sm);
}
.api-icon {
  width: 38px; height: 38px;
  background: var(--bleu-light);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 1.1rem;
}
.api-label {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--gris-texte);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 0.35rem;
}
.api-input-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex: 1;
}
.api-input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.55rem 0.9rem;
  font-size: 0.88rem;
  font-family: 'DM Sans', monospace;
  color: var(--noir);
  background: var(--gris-clair);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.api-input:focus {
  border-color: var(--bleu-imt);
  box-shadow: 0 0 0 3px var(--bleu-light);
  background: var(--blanc);
}
.api-status {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #ccc;
  flex-shrink: 0;
  transition: background 0.3s;
}
.api-status.ok  { background: #22c55e; }
.api-status.err { background: #ef4444; }

/* ── TRANSLATOR CARD ── */
.translator-card {
  background: var(--blanc);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

/* Language bar */
.lang-bar {
  display: flex;
  align-items: center;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
  gap: 0.75rem;
  background: var(--blanc);
}
.lang-chip {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  padding: 0.45rem 1rem;
  border-radius: 20px;
  border: 2px solid transparent;
}
.lang-chip.source {
  background: var(--bleu-light);
  border-color: var(--bleu-imt);
  color: #006f87;
}
.lang-chip.target {
  background: var(--violet-light);
  border-color: var(--violet-imt);
  color: var(--violet-imt);
}
.lang-arrow {
  font-size: 1.1rem;
  color: var(--gris-texte);
}

/* Text panels */
.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 280px;
}
.panel {
  display: flex;
  flex-direction: column;
  position: relative;
}
.panel + .panel {
  border-left: 1px solid var(--border);
}
.panel-label {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--gris-texte);
  padding: 0.75rem 1.25rem 0.5rem;
}
textarea.panel-text {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  padding: 0.25rem 1.25rem 1rem;
  font-size: 1rem;
  font-family: 'DM Sans', sans-serif;
  color: var(--noir);
  background: transparent;
  line-height: 1.65;
  min-height: 220px;
}
textarea.panel-text::placeholder { color: #b0b8c4; }

.panel-output {
  flex: 1;
  padding: 0.25rem 1.25rem 1rem;
  font-size: 1rem;
  font-family: 'DM Sans', sans-serif;
  color: var(--noir);
  line-height: 1.65;
  min-height: 220px;
  position: relative;
}
.panel-output.loading::after {
  content: '';
  display: block;
  width: 28px; height: 28px;
  border: 3px solid var(--bleu-light);
  border-top-color: var(--bleu-imt);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
}
@keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

.placeholder-hint {
  color: #b0b8c4;
  font-style: italic;
}

/* Action bar */
.action-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.875rem 1.25rem;
  border-top: 1px solid var(--border);
  background: var(--gris-clair);
  gap: 0.75rem;
}
.char-count {
  font-size: 0.78rem;
  color: var(--gris-texte);
}
.btn-group { display: flex; gap: 0.5rem; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.55rem 1.1rem;
  border-radius: 8px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
}
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: linear-gradient(135deg, var(--bleu-imt), #0098c0);
  color: var(--blanc);
  box-shadow: 0 2px 10px rgba(0,184,222,0.35);
}
.btn-primary:hover { opacity: 0.92; box-shadow: 0 4px 16px rgba(0,184,222,0.4); }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

.btn-secondary {
  background: var(--blanc);
  color: var(--gris-texte);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--gris-clair); color: var(--noir); }
.btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-copy {
  background: var(--violet-light);
  color: var(--violet-imt);
  border: 1px solid rgba(173,29,137,0.2);
}
.btn-copy:hover { background: rgba(173,29,137,0.18); }
.btn-copy:disabled { opacity: 0.4; cursor: not-allowed; }

/* Copy feedback */
.btn-copy.copied {
  background: rgba(34,197,94,0.12);
  color: #16a34a;
  border-color: rgba(34,197,94,0.3);
}

/* ── ERROR BANNER ── */
.error-banner {
  background: #fff1f1;
  border: 1px solid #fca5a5;
  border-radius: 10px;
  padding: 0.9rem 1.25rem;
  font-size: 0.88rem;
  color: #b91c1c;
  display: none;
  align-items: flex-start;
  gap: 0.6rem;
}
.error-banner.visible { display: flex; }
.error-banner span { line-height: 1.5; }

/* ── FOOTER ── */
footer {
  text-align: center;
  padding: 1.5rem;
  font-size: 0.78rem;
  color: var(--gris-texte);
  border-top: 1px solid var(--border);
  background: var(--blanc);
}
.footer-brand {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 600;
  color: var(--bleu-imt);
}

/* ── RESPONSIVE ── */
@media (max-width: 620px) {
  .panels { grid-template-columns: 1fr; }
  .panel + .panel { border-left: none; border-top: 1px solid var(--border); }
  .api-card { flex-direction: column; align-items: flex-start; }
  .api-input-wrap { width: 100%; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="logo-text">IMT Business School</div>
    <div class="logo-sep"></div>
    <div class="app-title">SuperTraducteur</div>
  </div>
</header>

<!-- MAIN -->
<main>

  <!-- Clef API -->
  <div class="api-card">
    <div class="api-icon">🔑</div>
    <div style="flex:1">
      <div class="api-label">Clef API Mistral</div>
      <div class="api-input-wrap">
        <input
          type="password"
          id="apiKey"
          class="api-input"
          placeholder="Coller votre clef API Mistral ici…"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="api-status" id="apiStatus" title="Statut de la clef"></div>
      </div>
    </div>
  </div>

  <!-- Bandeau erreur -->
  <div class="error-banner" id="errorBanner">
    <span>⚠️</span>
    <span id="errorMsg"></span>
  </div>

  <!-- Traducteur -->
  <div class="translator-card">

    <!-- Barre de langues -->
    <div class="lang-bar">
      <div class="lang-chip source">🇫🇷 Français</div>
      <div class="lang-arrow">→</div>
      <div class="lang-chip target">🇬🇧 Anglais</div>
    </div>

    <!-- Panneaux texte -->
    <div class="panels">
      <!-- Source -->
      <div class="panel">
        <div class="panel-label">Texte à traduire</div>
        <textarea
          id="sourceText"
          class="panel-text"
          placeholder="Saisissez votre texte en français…"
          maxlength="5000"
          spellcheck="true"
          lang="fr"
        ></textarea>
      </div>
      <!-- Résultat -->
      <div class="panel">
        <div class="panel-label">Traduction</div>
        <div class="panel-output placeholder-hint" id="outputArea">
          La traduction apparaîtra ici.
        </div>
      </div>
    </div>

    <!-- Barre d'actions -->
    <div class="action-bar">
      <span class="char-count" id="charCount">0 / 5000 caractères</span>
      <div class="btn-group">
        <button class="btn btn-secondary" id="clearBtn" disabled>
          ✕ Effacer
        </button>
        <button class="btn btn-copy" id="copyBtn" disabled>
          📋 Copier
        </button>
        <button class="btn btn-primary" id="translateBtn" disabled>
          ✦ Traduire
        </button>
      </div>
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer>
  Propulsé par <span class="footer-brand">Mistral AI</span> · Outil interne
  <span class="footer-brand">IMT Business School</span>
</footer>

<script>
const apiKeyInput   = document.getElementById('apiKey');
const apiStatus     = document.getElementById('apiStatus');
const sourceText    = document.getElementById('sourceText');
const outputArea    = document.getElementById('outputArea');
const translateBtn  = document.getElementById('translateBtn');
const clearBtn      = document.getElementById('clearBtn');
const copyBtn       = document.getElementById('copyBtn');
const charCount     = document.getElementById('charCount');
const errorBanner   = document.getElementById('errorBanner');
const errorMsg      = document.getElementById('errorMsg');

let currentTranslation = '';

// ── Mise à jour du compteur et des boutons
sourceText.addEventListener('input', () => {
  const len = sourceText.value.length;
  charCount.textContent = `${len} / 5000 caractères`;
  clearBtn.disabled     = len === 0;
  updateTranslateBtn();
});

// ── Validation visuelle clef API
apiKeyInput.addEventListener('input', () => {
  const key = apiKeyInput.value.trim();
  if (key.length === 0) {
    apiStatus.className = 'api-status';
  } else if (key.startsWith('') && key.length > 20) {
    apiStatus.className = 'api-status ok';
  } else {
    apiStatus.className = 'api-status err';
  }
  updateTranslateBtn();
});

function updateTranslateBtn() {
  const hasKey  = apiKeyInput.value.trim().length > 20;
  const hasText = sourceText.value.trim().length > 0;
  translateBtn.disabled = !(hasKey && hasText);
}

// ── Effacer
clearBtn.addEventListener('click', () => {
  sourceText.value = '';
  charCount.textContent = '0 / 5000 caractères';
  clearBtn.disabled = true;
  copyBtn.disabled  = true;
  translateBtn.disabled = true;
  outputArea.textContent = 'La traduction apparaîtra ici.';
  outputArea.className = 'panel-output placeholder-hint';
  currentTranslation = '';
  hideError();
});

// ── Copier
copyBtn.addEventListener('click', () => {
  if (!currentTranslation) return;
  navigator.clipboard.writeText(currentTranslation).then(() => {
    copyBtn.textContent = '✓ Copié !';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.innerHTML = '📋 Copier';
      copyBtn.classList.remove('copied');
    }, 2000);
  });
});

// ── Traduire
translateBtn.addEventListener('click', translate);
sourceText.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') translate();
});

async function translate() {
  const key  = apiKeyInput.value.trim();
  const text = sourceText.value.trim();
  if (!key || !text) return;

  hideError();
  translateBtn.disabled = true;
  outputArea.textContent = '';
  outputArea.className = 'panel-output loading';
  copyBtn.disabled = true;

  try {
    const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: 'mistral-large-latest',
        messages: [
          {
            role: 'system',
            content: 'You are a professional French to English translator. Translate the user\'s text accurately and naturally. Output only the translation, no explanations, no extra text.'
          },
          {
            role: 'user',
            content: text
          }
        ],
        temperature: 0.2,
        max_tokens: 4096
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err?.message || `Erreur HTTP ${response.status}`);
    }

    const data = await response.json();
    currentTranslation = data.choices?.[0]?.message?.content?.trim() || '';

    outputArea.className = 'panel-output';
    outputArea.textContent = currentTranslation;
    copyBtn.disabled = currentTranslation.length === 0;
    apiStatus.className = 'api-status ok';

  } catch (err) {
    outputArea.className = 'panel-output placeholder-hint';
    outputArea.textContent = 'La traduction apparaîtra ici.';
    showError(err.message || 'Une erreur est survenue. Vérifiez votre clef API.');
    if (err.message?.includes('401') || err.message?.toLowerCase().includes('unauthorized')) {
      apiStatus.className = 'api-status err';
    }
  } finally {
    updateTranslateBtn();
  }
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorBanner.classList.add('visible');
}
function hideError() {
  errorBanner.classList.remove('visible');
}
</script>
</body>
</html>
